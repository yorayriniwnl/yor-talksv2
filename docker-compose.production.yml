services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yor_talks}
      POSTGRES_USER: ${POSTGRES_USER:-yor_talks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data_production:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_data_production:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    command: ["pnpm", "--filter", "@workspace/db", "migrate:production"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL to the isolated migration/backup owner connection}
      APP_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the restricted runtime connection}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER to a new dedicated restricted runtime role}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD to an independent runtime role secret}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:?Set CONTACT_SHIELD_SECRET in .env.production}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env.production}
      PUBLIC_BETA: ${PUBLIC_BETA:-true}
      TERMS_VERSION: ${TERMS_VERSION:?Set TERMS_VERSION in .env.production}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:?Set CONTACT_SHIELD_SECRET in .env.production}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env.production}
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
      PUBLIC_BETA: ${PUBLIC_BETA:-true}
      TERMS_VERSION: ${TERMS_VERSION:?Set TERMS_VERSION in .env.production}
      LEGAL_CONTENT_REVIEWED: ${LEGAL_CONTENT_REVIEWED:-false}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env.production}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_MEDIA_IMAGE_PRESET: ${CLOUDINARY_MEDIA_IMAGE_PRESET:-}
      CLOUDINARY_MEDIA_VIDEO_PRESET: ${CLOUDINARY_MEDIA_VIDEO_PRESET:-}
      CLOUDINARY_MEDIA_AUDIO_PRESET: ${CLOUDINARY_MEDIA_AUDIO_PRESET:-}
      MEDIA_FFPROBE_PATH: ${MEDIA_FFPROBE_PATH:-ffprobe}
      MEDIA_FFMPEG_PATH: ${MEDIA_FFMPEG_PATH:-ffmpeg}
      MEDIA_DECODE_TIMEOUT_MS: ${MEDIA_DECODE_TIMEOUT_MS:-30000}
      MEDIA_DECODE_CONCURRENCY: ${MEDIA_DECODE_CONCURRENCY:-2}
      MEDIA_PROVIDER_TIMEOUT_MS: ${MEDIA_PROVIDER_TIMEOUT_MS:-15000}
      MEDIA_MODERATION_TIMEOUT_MS: ${MEDIA_MODERATION_TIMEOUT_MS:-30000}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-300}
      MEDIA_DELIVERY_ORIGIN: ${MEDIA_DELIVERY_ORIGIN:-}
      MEDIA_GEMINI_MODEL: ${MEDIA_GEMINI_MODEL:-gemini-2.5-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MARKETING_EMAIL_ENABLED: ${MARKETING_EMAIL_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_ACCOUNT_ID: ${RAZORPAY_ACCOUNT_ID:-}
      PAYMENT_EVENT_ENCRYPTION_KEY: ${PAYMENT_EVENT_ENCRYPTION_KEY:-}
      YOR_PREMIUM_ENABLED: ${YOR_PREMIUM_ENABLED:-false}
      YOR_PREMIUM_PRICE_MINOR: ${YOR_PREMIUM_PRICE_MINOR:-0}
      YOR_PREMIUM_DURATION_DAYS: ${YOR_PREMIUM_DURATION_DAYS:-30}
      YOR_PREMIUM_TERMS_VERSION: ${YOR_PREMIUM_TERMS_VERSION:-}
      YOR_PREMIUM_REFUND_POLICY: ${YOR_PREMIUM_REFUND_POLICY:-}
      YOR_ADVANCED_DEFAULT_ENABLED: ${YOR_ADVANCED_DEFAULT_ENABLED:-true}
      YOR_FEATURE_STORY_PRIVATE_VIEW: ${YOR_FEATURE_STORY_PRIVATE_VIEW:-}
      YOR_FEATURE_STORY_REWATCH_ANALYTICS: ${YOR_FEATURE_STORY_REWATCH_ANALYTICS:-}
      YOR_FEATURE_MESSAGE_UNREAD_PREVIEW: ${YOR_FEATURE_MESSAGE_UNREAD_PREVIEW:-}
      YOR_FEATURE_CUSTOM_BIO_FONT: ${YOR_FEATURE_CUSTOM_BIO_FONT:-}
      YOR_FEATURE_CUSTOM_APP_ICON: ${YOR_FEATURE_CUSTOM_APP_ICON:-}
      YOR_FEATURE_STORY_PRIORITY: ${YOR_FEATURE_STORY_PRIORITY:-}
      YOR_FEATURE_SUPER_HEART: ${YOR_FEATURE_SUPER_HEART:-}
      YOR_FEATURE_EXTENDED_STORY: ${YOR_FEATURE_EXTENDED_STORY:-}
      YOR_FEATURE_SIX_PINNED_POSTS: ${YOR_FEATURE_SIX_PINNED_POSTS:-}
      YOR_FEATURE_CUSTOM_STORY_AUDIENCE: ${YOR_FEATURE_CUSTOM_STORY_AUDIENCE:-}
      YOR_FEATURE_PROFILE_ONLY_POST: ${YOR_FEATURE_PROFILE_ONLY_POST:-}
      YOR_FEATURE_DIRECT_HIGHLIGHT: ${YOR_FEATURE_DIRECT_HIGHLIGHT:-}
      YOR_FEATURE_MESSAGE_FONT: ${YOR_FEATURE_MESSAGE_FONT:-}
      YOR_FEATURE_STORY_FONT: ${YOR_FEATURE_STORY_FONT:-}
      YOR_FEATURE_STORY_VIEW_TIMESTAMPS: ${YOR_FEATURE_STORY_VIEW_TIMESTAMPS:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      SELLER_ENABLED: ${SELLER_ENABLED:-false}
      MEMBERSHIPS_ENABLED: ${MEMBERSHIPS_ENABLED:-false}
      AI_COMPANION_ENABLED: ${AI_COMPANION_ENABLED:-false}
      ELIGIBILITY_ASSURANCE_ADAPTER: ${ELIGIBILITY_ASSURANCE_ADAPTER:-unavailable}
      ELIGIBILITY_POLICY_SOURCE: ${ELIGIBILITY_POLICY_SOURCE:-approved_registry}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?Set LEGAL_OPERATOR_NAME in .env.production}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:?Set LEGAL_OPERATOR_ADDRESS in .env.production}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:?Set LEGAL_EFFECTIVE_DATE in .env.production}
      LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:?Set LEGAL_GOVERNING_LAW in .env.production}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?Set PRIVACY_CONTACT_EMAIL in .env.production}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL in .env.production}
      GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:?Set GRIEVANCE_OFFICER_NAME in .env.production}
      GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:?Set GRIEVANCE_CONTACT_EMAIL in .env.production}
      PROMOTIONAL_EMAIL_ENABLED: ${PROMOTIONAL_EMAIL_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend
    secrets:
      - metrics_bearer_token
    group_add:
      - "${SECRET_READER_GID:?Set SECRET_READER_GID to the dedicated host secret-reader group ID}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backup:
    profiles: [ops]
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL to the isolated migration/backup owner connection}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT in .env.production}
      BACKUP_REMOTE: ${BACKUP_REMOTE:?Set BACKUP_REMOTE in .env.production}
      BACKUP_DIR: /backups
      BACKUP_METRICS_FILE: /metrics/yor-talks-backup.prom
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-14}
      TMPDIR: /tmp
      RCLONE_CACHE_DIR: /tmp/rclone-cache
    volumes:
      - backup_staging:/backups
      - backup_metrics:/metrics
    secrets:
      - source: rclone_config
        target: /root/.config/rclone/rclone.conf
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backup-metrics-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - backup_metrics:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_bearer_token
    group_add:
      - "${SECRET_READER_GID:?Set SECRET_READER_GID to the dedicated host secret-reader group ID}"
    networks:
      - backend
    depends_on:
      - api
      - alertmanager
      - backup-metrics-exporter
    restart: unless-stopped

  alertmanager-config:
    image: node:24-alpine
    entrypoint: ["node", "/scripts/render-alertmanager-config.mjs"]
    # This one-shot renderer must write fresh root-owned and older nobody-owned
    # volumes. Its only writable persistent mount is the generated config.
    user: "0:0"
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:?Set ALERTMANAGER_WEBHOOK_URL in .env.production}
      ALERTMANAGER_WEBHOOK_USER: ${ALERTMANAGER_WEBHOOK_USER:?Set ALERTMANAGER_WEBHOOK_USER in .env.production}
      ALERTMANAGER_TEMPLATE_FILE: /templates/alertmanager.yml
      ALERTMANAGER_OUTPUT_FILE: /rendered/alertmanager.yml
    volumes:
      - ./ops/prometheus/alertmanager.yml:/templates/alertmanager.yml:ro
      - ./ops/prometheus/render-alertmanager-config.mjs:/scripts/render-alertmanager-config.mjs:ro
      - alertmanager_config:/rendered
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_config:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    secrets:
      - source: alertmanager_webhook_password
        target: /run/secrets/alertmanager_webhook_password
    group_add:
      - "${SECRET_READER_GID:?Set SECRET_READER_GID to the dedicated host secret-reader group ID}"
    networks:
      - edge
      - backend
    depends_on:
      alertmanager-config:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: social/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:?Set VITE_PUBLIC_ORIGIN to the production HTTPS web origin}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RTC_ICE_SERVERS: ${VITE_RTC_ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
        CSP_LIVEKIT_URL: ${LIVEKIT_URL:-}
        VITE_PUBLIC_BETA: ${PUBLIC_BETA:-true}
        VITE_TERMS_VERSION: ${TERMS_VERSION:-}
        VITE_LEGAL_CONTENT_REVIEWED: ${LEGAL_CONTENT_REVIEWED:-false}
        VITE_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
        VITE_LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:-}
        VITE_PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        VITE_GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:-}
        VITE_GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:-}
        VITE_PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
        VITE_LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
        VITE_WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
        VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
        VITE_RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,noexec,nosuid,nodev
      - /var/run:size=1m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

secrets:
  metrics_bearer_token:
    file: ${METRICS_BEARER_TOKEN_FILE:?Set METRICS_BEARER_TOKEN_FILE in .env.production}
  rclone_config:
    file: ${RCLONE_CONFIG_FILE:?Set RCLONE_CONFIG_FILE in .env.production}
  alertmanager_webhook_password:
    file: ${ALERTMANAGER_WEBHOOK_PASSWORD_FILE:?Set ALERTMANAGER_WEBHOOK_PASSWORD_FILE in .env.production}

volumes:
  postgres_data_production:
  redis_data_production:
  backup_staging:
  backup_metrics:
  prometheus_data:
  alertmanager_data:
  alertmanager_config:
