services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yor_talks}
      POSTGRES_USER: ${POSTGRES_USER:-yor_talks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data_production:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
      - redis_data_production:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    command: ["pnpm", "--filter", "@workspace/db", "migrate:production"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:?Set CONTACT_SHIELD_SECRET in .env.production}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env.production}
      PUBLIC_BETA: ${PUBLIC_BETA:-true}
      TERMS_VERSION: ${TERMS_VERSION:?Set TERMS_VERSION in .env.production}
      MINIMUM_AGE: ${MINIMUM_AGE:-18}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:?Set CONTACT_SHIELD_SECRET in .env.production}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env.production}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?Set LEGAL_OPERATOR_NAME in .env.production}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:?Set LEGAL_OPERATOR_ADDRESS in .env.production}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:?Set LEGAL_EFFECTIVE_DATE in .env.production}
      LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:?Set LEGAL_GOVERNING_LAW in .env.production}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?Set PRIVACY_CONTACT_EMAIL in .env.production}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL in .env.production}
      GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:?Set GRIEVANCE_OFFICER_NAME in .env.production}
      GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:?Set GRIEVANCE_CONTACT_EMAIL in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "4000"
    networks:
      - edge
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: social/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RTC_ICE_SERVERS: ${VITE_RTC_ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
        VITE_PUBLIC_BETA: ${PUBLIC_BETA:-true}
        VITE_TERMS_VERSION: ${TERMS_VERSION:-}
        VITE_MINIMUM_AGE: ${MINIMUM_AGE:-18}
        VITE_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
        VITE_LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:-}
        VITE_PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        VITE_GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:-}
        VITE_GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:-}
        VITE_PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
        VITE_LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
        VITE_WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
        VITE_RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data_production:
  redis_data_production:
