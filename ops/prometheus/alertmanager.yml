global:
  resolve_timeout: 5m

route:
  receiver: deployment-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: deployment-webhook
    webhook_configs:
      # Copy to a protected operator-owned file and replace this canonical
      # HTTPS endpoint/user. The complete file is mounted as a Docker secret;
      # Alertmanager 0.28.1 does not expand environment placeholders.
      - url: https://alerts.example.invalid/webhook
        send_resolved: true
        http_config:
          basic_auth:
            username: yor-talks-alerts
            password_file: /run/secrets/alertmanager_webhook_password
