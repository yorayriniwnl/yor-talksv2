# Synthetic, loopback-only infrastructure. Never point tests at a live database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yor_verify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yor_verify"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
