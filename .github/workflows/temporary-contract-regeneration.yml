name: Temporary API contract regeneration (remove after repair)

on:
  push:
    branches:
      - codex/compliance-audit-20261017

permissions:
  contents: write

concurrency:
  group: temporary-contract-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/codex/compliance-audit-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: codex/compliance-audit-20261017
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Regenerate the source-owned API contract
        run: pnpm contract:generate
      - name: Commit source-synchronized artifacts
        run: |
          set -euo pipefail
          git add -- api-server/src/docs/routes.generated.ts lib/api-spec/openapi.yaml
          if git diff --cached --quiet; then
            echo "Generated contracts already synchronized"
            exit 0
          fi
          git -c user.name='yor-talks-contract-bot' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "fix(contracts): regenerate source-synchronized API catalog"
          git push origin HEAD:refs/heads/codex/compliance-audit-20261017
