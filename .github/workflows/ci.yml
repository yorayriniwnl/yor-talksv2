name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yor_talks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_talks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Verify API contract is synchronized
        run: pnpm contract:check

      - name: Verify YOR visual framework tokens
        run: pnpm design:check

      - name: Run browser-state and session-boundary unit tests
        run: pnpm test:unit

      - name: Build database package
        run: pnpm --filter @workspace/db build

      - name: Build shared contract declarations
        run: pnpm exec tsc -b lib/api-zod

      - name: Apply schema migration
        run: pnpm --filter @workspace/db migrate:beta
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123

      - name: Typecheck API and web
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/social typecheck

      - name: Install media verification runtime
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Run API tests serially
        run: node --import tsx --test --test-concurrency=1 --test-timeout=90000 src/__tests__/*.test.ts
        working-directory: api-server
        env:
          MEDIA_REQUIRE_DECODER_TESTS: 'true'
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-access-secret-012345678901234567890123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build API and web
        run: |
          pnpm --filter @workspace/api-server build
          pnpm --filter @workspace/social build

      - name: Verify production configuration wiring
        run: pnpm production-config:check

      - name: Accept pinned monitoring runtimes and authenticated local alert delivery
        run: |
          set -euo pipefail
          mkdir -p /tmp/yor-monitoring-runtime
          cd /tmp/yor-monitoring-runtime
          curl -fsSLO https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz
          curl -fsSL https://github.com/prometheus/alertmanager/releases/download/v0.28.1/sha256sums.txt > alertmanager-sha256sums.txt
          grep '  alertmanager-0.28.1.linux-amd64.tar.gz$' alertmanager-sha256sums.txt | sha256sum --check --strict
          curl -fsSLO https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/sha256sums.txt > prometheus-sha256sums.txt
          grep '  prometheus-3.5.0.linux-amd64.tar.gz$' prometheus-sha256sums.txt | sha256sum --check --strict
          tar -xzf alertmanager-0.28.1.linux-amd64.tar.gz
          tar -xzf prometheus-3.5.0.linux-amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          AMTOOL_BIN=/tmp/yor-monitoring-runtime/alertmanager-0.28.1.linux-amd64/amtool \
          ALERTMANAGER_BIN=/tmp/yor-monitoring-runtime/alertmanager-0.28.1.linux-amd64/alertmanager \
          PROMTOOL_BIN=/tmp/yor-monitoring-runtime/prometheus-3.5.0.linux-amd64/promtool \
          PROMETHEUS_BIN=/tmp/yor-monitoring-runtime/prometheus-3.5.0.linux-amd64/prometheus \
            node ops/prometheus/acceptance.mjs

      - name: Validate production Compose file
        run: docker compose --env-file ops/ci-production.env -f docker-compose.production.yml config --quiet

      - name: Build production container images
        run: docker compose --project-name yor-talks-ci-release --env-file ops/ci-production.env -f docker-compose.production.yml --profile ops build migrate api web alertmanager backup

      - name: Exercise backup image encryption, retrieval, restore and failure guards
        run: node ops/backup/acceptance.mjs
        env:
          NODE_ENV: test
          BACKUP_USE_DOCKER: 'true'
          BACKUP_IMAGE: yor-talks-ci-release-backup
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379/5
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123
          JWT_SECRET: ci-access-secret-012345678901234567890123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789

      - name: Smoke test production container stack
        env:
          WEB_PORT: 127.0.0.1:18080
        run: |
          set -euo pipefail
          compose=(docker compose --project-name yor-talks-ci-release --env-file ops/ci-production.env -f docker-compose.production.yml -f ops/ci-provider-isolation.compose.yml)

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" ps --all
              "${compose[@]}" logs --no-color
            fi
            "${compose[@]}" down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT

          "${compose[@]}" up -d --no-build
          timeout 120 sh -c 'until curl --fail --silent --show-error http://127.0.0.1:18080/api/readyz >/dev/null; do sleep 2; done'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/api/readyz > /tmp/yor-talks-ci-readiness.json
          node -e "const report=JSON.parse(require('node:fs').readFileSync('/tmp/yor-talks-ci-readiness.json','utf8')); if(report.details?.media?.decoder!==true)throw new Error('Production media decoder is unavailable'); if(report.details?.media?.ready!==false)throw new Error('Synthetic unavailable providers must not enable production media');"
          SMOKE_SYNTHETIC_PROVIDERS=true BASE_URL=http://127.0.0.1:18080 pnpm smoke
          curl --silent --output /dev/null http://127.0.0.1:18080/api/release-audit-rate-limit-probe

          migration_id=$("${compose[@]}" ps --all --quiet migrate)
          api_id=$("${compose[@]}" ps --quiet api)
          redis_id=$("${compose[@]}" ps --quiet redis)
          alertmanager_id=$("${compose[@]}" ps --quiet alertmanager)
          test -n "$migration_id"
          test -n "$api_id"
          test -n "$redis_id"
          test -n "$alertmanager_id"
          docker exec "$alertmanager_id" wget -q -O /dev/null http://127.0.0.1:9093/-/ready
          web_image=$(docker inspect --format '{{.Config.Image}}' "$("${compose[@]}" ps --quiet web)")
          node ops/ingress/check-web-image.mjs "$web_image"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migration_id")" = "0"
          test "$(docker inspect --format '{{.Config.User}}' "$api_id")" = "node"
          test "$(docker inspect --format '{{json .HostConfig.Dns}}' "$api_id")" = '["127.0.0.1"]'
          docker exec "$api_id" node -e "require('node:dns').promises.lookup('api.cloudinary.com').then(({address})=>{if(address!=='127.0.0.1')throw new Error('CI provider isolation is unavailable');})"
          docker exec "$redis_id" sh -c 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" --scan --pattern "yor:rate:api:*" | grep -q "^yor:rate:api:"'

          api_logs=$("${compose[@]}" logs --no-color api)
          if grep -Eq 'async error during store initialization|Rate-limit Redis connection warning' <<<"$api_logs"; then
            printf '%s\n' "$api_logs"
            exit 1
          fi
