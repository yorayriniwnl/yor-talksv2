name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yor_talks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_talks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify API contract is synchronized
        run: pnpm contract:check

      - name: Verify YOR visual framework tokens
        run: pnpm design:check

      - name: Run browser-state and session-boundary unit tests
        run: pnpm test:unit

      - name: Build database package
        run: pnpm --filter @workspace/db build

      - name: Apply schema migration
        run: pnpm --filter @workspace/db migrate:beta
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123

      - name: Typecheck API and web
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/social typecheck

      - name: Run API tests serially
        run: node --import tsx --test --test-concurrency=1 src/__tests__/*.test.ts
        working-directory: api-server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-access-secret-012345678901234567890123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build API and web
        run: |
          pnpm --filter @workspace/api-server build
          pnpm --filter @workspace/social build

      - name: Verify production configuration wiring
        run: pnpm production-config:check

      - name: Validate production Compose file
        run: docker compose --env-file ops/ci-production.env -f docker-compose.production.yml config --quiet

      - name: Build production container images
        run: docker compose --env-file ops/ci-production.env -f docker-compose.production.yml build api web
