name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend security evidence must still run when an independently owned web
  # check fails. The existing full release verification remains required.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yor_talks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_talks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789
      CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123
      ELIGIBILITY_ASSURANCE_ADAPTER: unavailable
      ELIGIBILITY_POLICY_SOURCE: approved_registry
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit runtime and build dependencies
        run: pnpm audit

      - name: Verify API contract is synchronized
        run: pnpm contract:check

      - name: Run backend infrastructure regression tests
        run: node --test tests/ci-workflow.test.mjs tests/database-runtime-role.test.mjs tests/alertmanager-config.test.mjs tests/migration-safety.test.mjs tests/realtime-smoke.test.mjs tests/restore-deletion-verification.test.mjs

      - name: Verify restored-account detection against disposable PostgreSQL
        run: node --test ops/backup/restore-deletion-database.test.mjs
        env:
          RESTORE_VERIFICATION_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Verify preregistration schema migration against disposable PostgreSQL
        run: node --test tests/preregister-migration.test.mjs
        env:
          PREREGISTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks

      - name: Build database package
        run: pnpm --filter @workspace/db build

      - name: Apply schema migration
        run: pnpm --filter @workspace/db migrate:beta

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Install media verification runtime
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Run API tests serially
        run: node --import tsx --test --test-concurrency=1 src/__tests__/*.test.ts
        working-directory: api-server
        env:
          MEDIA_REQUIRE_DECODER_TESTS: 'true'

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Verify production configuration wiring
        run: pnpm production-config:check

      - name: Verify backup and restore failure cleanup
        run: bash ops/backup/backup-script.test.sh

      - name: Verify restricted database runtime role
        run: node ops/check-database-runtime-role.mjs
        env:
          DATABASE_ROLE_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # Container hardening and encrypted restore evidence must not depend on web
  # unit/browser checks. These remain mandatory alongside the full verify job.
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Container builds install their own frozen dependencies. The host checks
      # below use only Node built-ins and the runner's Docker/Compose runtime.
      - name: Validate production Compose file
        run: docker compose --env-file ops/ci-production.env -f docker-compose.production.yml config --quiet

      - name: Verify Linux production secret permissions
        run: node scripts/check-production-secret-permissions.mjs

      - name: Build production container images
        run: docker compose --project-name yor-talks-ci-release --env-file ops/ci-production.env -f docker-compose.production.yml build migrate api web backup

      - name: Smoke test production container stack
        env:
          WEB_PORT: 18080
          SMOKE_BROWSER_ORIGIN: https://ci.example
        run: |
          set -euo pipefail
          compose=(docker compose --project-name yor-talks-ci-release --env-file ops/ci-production.env -f docker-compose.production.yml -f ops/ci-provider-isolation.compose.yml)

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              "${compose[@]}" ps --all
              "${compose[@]}" logs --no-color
            fi
            # Include the backup profile so one-off run volumes are removed too.
            "${compose[@]}" --profile ops down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT

          "${compose[@]}" up -d --no-build
          timeout 120 sh -c 'until curl --fail --silent --show-error http://127.0.0.1:18080/api/readyz >/dev/null; do sleep 2; done'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/healthz >/dev/null
          # Core readiness is independent of optional media-provider latency.
          # Wait separately for the background media diagnostic to settle.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const deadline = Date.now() + 60_000;
          let report;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:18080/api/readyz', { signal: AbortSignal.timeout(5_000) });
              if (!response.ok) throw new Error('Core readiness is unavailable');
              report = await response.json();
              if (report.details?.media?.decoder === true) break;
            } catch { report = undefined; }
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          if (report?.details?.media?.decoder !== true) throw new Error('Production media decoder is unavailable');
          if (report.details.media.ready !== false) throw new Error('Synthetic unavailable providers must not enable production media');
          fs.writeFileSync('/tmp/yor-talks-ci-readiness.json', JSON.stringify(report));
          NODE
          BASE_URL=http://127.0.0.1:18080 pnpm smoke
          curl --silent --output /dev/null http://127.0.0.1:18080/api/release-audit-rate-limit-probe
          BACKUP_SMOKE_COMPOSE_PROJECT=yor-talks-ci-release bash ops/backup/ci-roundtrip-smoke.sh

          migration_id=$("${compose[@]}" ps --all --quiet migrate)
          api_id=$("${compose[@]}" ps --quiet api)
          redis_id=$("${compose[@]}" ps --quiet redis)
          test -n "$migration_id"
          test -n "$api_id"
          test -n "$redis_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migration_id")" = "0"
          test "$(docker inspect --format '{{.Config.User}}' "$api_id")" = "node"
          test "$(docker inspect --format '{{json .HostConfig.Dns}}' "$api_id")" = '["127.0.0.1"]'
          docker exec "$api_id" node -e "require('node:dns').promises.lookup('api.cloudinary.com').then(({address})=>{if(address!=='127.0.0.1')throw new Error('CI provider isolation is unavailable');})"
          docker exec "$redis_id" sh -c 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" --scan --pattern "yor:rate:api:*" | grep -q "^yor:rate:api:"'

          api_logs=$("${compose[@]}" logs --no-color api)
          if grep -Eq 'async error during store initialization|Rate-limit Redis connection warning' <<<"$api_logs"; then
            printf '%s\n' "$api_logs"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yor_talks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_talks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several browser runtime libraries are declared as devDependencies in
      # the Vite workspace, so --prod alone would omit shipped dependencies.
      - name: Audit runtime and build dependencies
        run: pnpm audit

      - name: Verify API contract is synchronized
        run: |
          pnpm contract:check
          pnpm contract:clients:check

      - name: Verify YOR visual framework tokens
        run: pnpm design:check

      - name: Run browser-state and session-boundary unit tests
        run: pnpm test:unit
        env:
          PREREGISTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks

      - name: Build database package
        run: pnpm --filter @workspace/db build

      - name: Apply schema migration
        run: pnpm --filter @workspace/db migrate:beta
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123

      - name: Typecheck API and web
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/social typecheck

      - name: Install media verification runtime
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Run API tests serially
        run: node --import tsx --test --test-concurrency=1 src/__tests__/*.test.ts
        working-directory: api-server
        env:
          MEDIA_REQUIRE_DECODER_TESTS: 'true'
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-access-secret-012345678901234567890123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789
          CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123
          # Synthetic authority is injected by test-only constructors; the app keeps production defaults.
          ELIGIBILITY_ASSURANCE_ADAPTER: unavailable
          ELIGIBILITY_POLICY_SOURCE: approved_registry

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build API and web
        run: |
          pnpm --filter @workspace/api-server build
          pnpm --filter @workspace/social build

      - name: Verify production configuration wiring
        run: pnpm production-config:check

      - name: Verify backup and restore failure cleanup
        run: bash ops/backup/backup-script.test.sh

      - name: Verify restricted database runtime role
        run: node ops/check-database-runtime-role.mjs
        env:
          DATABASE_ROLE_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
