name: Temporary integrated API regressions
on:
  push:
    branches: ['codex/compliance-audit-20261017']
permissions:
  contents: read
jobs:
  targeted-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yor_talks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d yor_talks"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yor_talks
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-access-secret-012345678901234567890123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-012345678901234567890123456789
      CONTACT_SHIELD_SECRET: ci-contact-shield-secret-012345678901234567890123
      ELIGIBILITY_ASSURANCE_ADAPTER: unavailable
      ELIGIBILITY_POLICY_SOURCE: approved_registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db build
      - run: pnpm --filter @workspace/db migrate:beta
      - name: Run regressions for the ten documented failures
        working-directory: api-server
        run: timeout 420s node --import tsx --test --test-concurrency=1 --test-reporter spec src/__tests__/account-service.test.ts src/__tests__/ai-response.test.ts src/__tests__/audience-regression.test.ts src/__tests__/disappearing-message.test.ts src/__tests__/discovery-batching.test.ts src/__tests__/eligibility-acceptance.integration.test.ts src/__tests__/health-disclosure.test.ts src/__tests__/report-authorization.integration.test.ts src/__tests__/moderation-service.test.ts
