services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yor_talks_staging}
      POSTGRES_USER: ${POSTGRES_USER:-yor_talks_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - staging_backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.staging}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.staging}
    volumes:
      - redis_data_staging:/data
    networks:
      - staging_backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    command: ["pnpm", "--filter", "@workspace/db", "migrate:production"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:?Set CONTACT_SHIELD_SECRET in .env.staging}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env.staging}
      PUBLIC_BETA: ${PUBLIC_BETA:-false}
      TERMS_VERSION: ${TERMS_VERSION:?Set TERMS_VERSION in .env.staging}
      MINIMUM_AGE: ${MINIMUM_AGE:-18}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging_backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.staging}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.staging}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.staging}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:?Set CONTACT_SHIELD_SECRET in .env.staging}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env.staging}
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
      PUBLIC_BETA: ${PUBLIC_BETA:-false}
      TERMS_VERSION: ${TERMS_VERSION:?Set TERMS_VERSION in .env.staging}
      MINIMUM_AGE: ${MINIMUM_AGE:-18}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:?Set ALLOWED_EMAIL_DOMAINS in .env.staging for staging test audience}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.staging}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env.staging}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_MEDIA_IMAGE_PRESET: ${CLOUDINARY_MEDIA_IMAGE_PRESET:-}
      CLOUDINARY_MEDIA_VIDEO_PRESET: ${CLOUDINARY_MEDIA_VIDEO_PRESET:-}
      CLOUDINARY_MEDIA_AUDIO_PRESET: ${CLOUDINARY_MEDIA_AUDIO_PRESET:-}
      MEDIA_FFPROBE_PATH: ${MEDIA_FFPROBE_PATH:-ffprobe}
      MEDIA_FFMPEG_PATH: ${MEDIA_FFMPEG_PATH:-ffmpeg}
      MEDIA_DECODE_TIMEOUT_MS: ${MEDIA_DECODE_TIMEOUT_MS:-30000}
      MEDIA_DECODE_CONCURRENCY: ${MEDIA_DECODE_CONCURRENCY:-2}
      MEDIA_PROVIDER_TIMEOUT_MS: ${MEDIA_PROVIDER_TIMEOUT_MS:-15000}
      MEDIA_MODERATION_TIMEOUT_MS: ${MEDIA_MODERATION_TIMEOUT_MS:-30000}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-300}
      MEDIA_DELIVERY_ORIGIN: ${MEDIA_DELIVERY_ORIGIN:-}
      MEDIA_GEMINI_MODEL: ${MEDIA_GEMINI_MODEL:-gemini-2.5-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_ACCOUNT_ID: ${RAZORPAY_ACCOUNT_ID:-}
      PAYMENT_EVENT_ENCRYPTION_KEY: ${PAYMENT_EVENT_ENCRYPTION_KEY:-}
      YOR_PREMIUM_ENABLED: ${YOR_PREMIUM_ENABLED:-false}
      YOR_PREMIUM_PRICE_MINOR: ${YOR_PREMIUM_PRICE_MINOR:-0}
      YOR_PREMIUM_DURATION_DAYS: ${YOR_PREMIUM_DURATION_DAYS:-30}
      YOR_PREMIUM_TERMS_VERSION: ${YOR_PREMIUM_TERMS_VERSION:-}
      YOR_PREMIUM_REFUND_POLICY: ${YOR_PREMIUM_REFUND_POLICY:-}
      YOR_ADVANCED_DEFAULT_ENABLED: ${YOR_ADVANCED_DEFAULT_ENABLED:-true}
      YOR_FEATURE_STORY_PRIVATE_VIEW: ${YOR_FEATURE_STORY_PRIVATE_VIEW:-}
      YOR_FEATURE_STORY_REWATCH_ANALYTICS: ${YOR_FEATURE_STORY_REWATCH_ANALYTICS:-}
      YOR_FEATURE_MESSAGE_UNREAD_PREVIEW: ${YOR_FEATURE_MESSAGE_UNREAD_PREVIEW:-}
      YOR_FEATURE_CUSTOM_BIO_FONT: ${YOR_FEATURE_CUSTOM_BIO_FONT:-}
      YOR_FEATURE_CUSTOM_APP_ICON: ${YOR_FEATURE_CUSTOM_APP_ICON:-}
      YOR_FEATURE_STORY_PRIORITY: ${YOR_FEATURE_STORY_PRIORITY:-}
      YOR_FEATURE_SUPER_HEART: ${YOR_FEATURE_SUPER_HEART:-}
      YOR_FEATURE_EXTENDED_STORY: ${YOR_FEATURE_EXTENDED_STORY:-}
      YOR_FEATURE_SIX_PINNED_POSTS: ${YOR_FEATURE_SIX_PINNED_POSTS:-}
      YOR_FEATURE_CUSTOM_STORY_AUDIENCE: ${YOR_FEATURE_CUSTOM_STORY_AUDIENCE:-}
      YOR_FEATURE_PROFILE_ONLY_POST: ${YOR_FEATURE_PROFILE_ONLY_POST:-}
      YOR_FEATURE_DIRECT_HIGHLIGHT: ${YOR_FEATURE_DIRECT_HIGHLIGHT:-}
      YOR_FEATURE_MESSAGE_FONT: ${YOR_FEATURE_MESSAGE_FONT:-}
      YOR_FEATURE_STORY_FONT: ${YOR_FEATURE_STORY_FONT:-}
      YOR_FEATURE_STORY_VIEW_TIMESTAMPS: ${YOR_FEATURE_STORY_VIEW_TIMESTAMPS:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      SELLER_ENABLED: ${SELLER_ENABLED:-false}
      MEMBERSHIPS_ENABLED: ${MEMBERSHIPS_ENABLED:-false}
      AI_COMPANION_ENABLED: ${AI_COMPANION_ENABLED:-false}
      ELIGIBILITY_ASSURANCE_ADAPTER: ${ELIGIBILITY_ASSURANCE_ADAPTER:-unavailable}
      ELIGIBILITY_POLICY_SOURCE: ${ELIGIBILITY_POLICY_SOURCE:-approved_registry}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?Set LEGAL_OPERATOR_NAME in .env.staging}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:?Set LEGAL_OPERATOR_ADDRESS in .env.staging}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:?Set LEGAL_EFFECTIVE_DATE in .env.staging}
      LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:?Set LEGAL_GOVERNING_LAW in .env.staging}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:?Set PRIVACY_CONTACT_EMAIL in .env.staging}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL in .env.staging}
      GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:?Set GRIEVANCE_OFFICER_NAME in .env.staging}
      GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:?Set GRIEVANCE_CONTACT_EMAIL in .env.staging}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    expose:
      - "4000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4001}:4000"
    networks:
      - staging_edge
      - staging_backend
    secrets:
      - metrics_bearer_token
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backup:
    profiles: [ops]
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT in .env.staging}
      BACKUP_REMOTE: ${BACKUP_REMOTE:?Set BACKUP_REMOTE in .env.staging}
      BACKUP_DIR: /backups
      BACKUP_METRICS_FILE: /metrics/yor-talks-backup.prom
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-7}
    volumes:
      - backup_staging_data:/backups
      - backup_metrics_staging:/metrics
    secrets:
      - source: rclone_config
        target: /root/.config/rclone/rclone.conf
    networks:
      - staging_backend
      - staging_edge
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backup-metrics-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - backup_metrics_staging:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - staging_backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data_staging:/prometheus
    secrets:
      - metrics_bearer_token
    networks:
      - staging_backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - api
      - alertmanager
      - backup-metrics-exporter
    restart: unless-stopped

  alertmanager:
    build:
      context: .
      dockerfile: ops/prometheus/Dockerfile.alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:?Set ALERTMANAGER_WEBHOOK_URL in .env.staging}
      ALERTMANAGER_WEBHOOK_USER: ${ALERTMANAGER_WEBHOOK_USER:?Set ALERTMANAGER_WEBHOOK_USER in .env.staging}
    volumes:
      - alertmanager_data_staging:/alertmanager
    secrets:
      - source: alertmanager_webhook_password
        target: /run/secrets/alertmanager_webhook_password
    networks:
      - staging_edge
      - staging_backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: social/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-}
        VITE_REALTIME_ENABLED: ${VITE_REALTIME_ENABLED:-true}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_RTC_ICE_SERVERS: ${VITE_RTC_ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
        VITE_PUBLIC_BETA: ${PUBLIC_BETA:-false}
        VITE_TERMS_VERSION: ${TERMS_VERSION:-}
        VITE_MINIMUM_AGE: ${MINIMUM_AGE:-18}
        VITE_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
        VITE_LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:-}
        VITE_PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        VITE_GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:-}
        VITE_GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:-}
        VITE_PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
        VITE_LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
        VITE_WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
        VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
        VITE_RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
    environment:
      TRUSTED_EDGE_CIDRS: ${TRUSTED_EDGE_CIDRS:-}
    ports:
      - "${WEB_PORT:-8081}:80"
    networks:
      - staging_edge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  staging_edge:
  staging_backend:
    internal: true

secrets:
  metrics_bearer_token:
    file: ${METRICS_BEARER_TOKEN_FILE:?Set METRICS_BEARER_TOKEN_FILE in .env.staging}
  rclone_config:
    file: ${RCLONE_CONFIG_FILE:?Set RCLONE_CONFIG_FILE in .env.staging}
  alertmanager_webhook_password:
    file: ${ALERTMANAGER_WEBHOOK_PASSWORD_FILE:?Set ALERTMANAGER_WEBHOOK_PASSWORD_FILE in .env.staging}

volumes:
  postgres_data_staging:
  redis_data_staging:
  backup_staging_data:
  backup_metrics_staging:
  prometheus_data_staging:
  alertmanager_data_staging:
