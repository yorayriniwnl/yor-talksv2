add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images.unsplash.com https://media.giphy.com https://picsum.photos https://res.cloudinary.com https://lh3.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' __CSP_CONNECT_ORIGINS__; frame-src 'self' https://accounts.google.com https://*.razorpay.com; worker-src 'self' blob:; media-src 'self' data: blob: https://res.cloudinary.com https://s3.amazonaws.com; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
