services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yor_talks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yor_talks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yor_talks
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-local-only}
      CONTACT_SHIELD_SECRET: ${CONTACT_SHIELD_SECRET:-contact-shield-development-secret-change-me}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-totp-development-encryption-key-change-me}
      PUBLIC_BETA: ${PUBLIC_BETA:-false}
      TERMS_VERSION: ${TERMS_VERSION:-development}
      MINIMUM_AGE: ${MINIMUM_AGE:-18}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
      LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:-}
      GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: social/Dockerfile
      args:
        VITE_PUBLIC_BETA: ${PUBLIC_BETA:-false}
        VITE_TERMS_VERSION: ${TERMS_VERSION:-development}
        VITE_MINIMUM_AGE: ${MINIMUM_AGE:-18}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
        VITE_LEGAL_GOVERNING_LAW: ${LEGAL_GOVERNING_LAW:-}
        VITE_PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        VITE_GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:-}
        VITE_GRIEVANCE_CONTACT_EMAIL: ${GRIEVANCE_CONTACT_EMAIL:-}
        VITE_PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
        VITE_LIVE_ROOMS_ENABLED: ${LIVE_ROOMS_ENABLED:-false}
        VITE_WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
        VITE_RTC_CALLS_ENABLED: ${RTC_CALLS_ENABLED:-false}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
