openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
tags:
  - name: auth
  - name: posts
  - name: communities
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier: { type: string }
                password: { type: string }
              required: [identifier, password]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/User"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
                fullName: { type: string }
              required: [username, email, password, fullName]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/User"

  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential: { type: string }
                totpCode: { type: string, minLength: 6, maxLength: 6 }
              required: [credential]
      responses:
        "200":
          description: Success or two-factor challenge
        "401":
          description: Invalid Google credential or account

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Success

  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                images: { type: array, items: { type: string } }
              required: [content]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/Post"

  /posts/{id}/like:
    post:
      operationId: likePost
      tags: [posts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success

  /communities:
    get:
      operationId: getCommunities
      tags: [communities]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Community"

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        avatarUrl: { type: string }
        bio: { type: string }
        followers: { type: array, items: { type: string } }
        following: { type: array, items: { type: string } }
    Post:
      type: object
      properties:
        id: { type: string }
        authorId: { type: string }
        content: { type: string }
        images: { type: array, items: { type: string } }
        createdAt: { type: string }
        likedBy: { type: array, items: { type: string } }
        comments: { type: array, items: { type: string } }
        shareCount: { type: integer }
    Community:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        ownerId: { type: string }
        memberIds: { type: array, items: { type: string } }
