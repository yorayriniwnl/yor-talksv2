<svg width="1600" height="650" viewBox="0 0 1600 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Yor Talks verified architecture</title>
  <desc>Yor Talks routes a browser session through a React and Vite frontend, an Express and Socket.IO API, Postgres and Drizzle persistence, Redis workers, and fail-closed provider boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000000"/><stop offset=".72" stop-color="#050505"/><stop offset="1" stop-color="#160303"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E84B4B"/><stop offset="1" stop-color="#FF8A7F"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#F5EAEA" stroke-opacity=".045"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#FF8A7F"/></marker>
  </defs>
  <rect width="1600" height="650" fill="url(#bg)"/><rect width="1600" height="650" fill="url(#grid)"/>
  <text x="62" y="70" fill="#FF8A7F" font-family="DM Mono, monospace" font-size="14" letter-spacing="3">YOR // ARCHITECTURE / VERIFIED CODE PATH</text>
  <text x="62" y="112" fill="#F5EAEA" font-family="Cormorant Garamond, Georgia, serif" font-size="42" font-weight="600">One social surface. Explicit boundaries.</text>
  <g font-family="DM Mono, monospace">
    <g transform="translate(62 190)"><rect width="246" height="220" fill="#050505" stroke="#671515"/><rect width="5" height="220" fill="#E84B4B"/><text x="24" y="38" fill="#FF8A7F" font-size="11" letter-spacing="2">01 / CLIENT</text><text x="24" y="84" fill="#F5EAEA" font-size="25">React + Vite</text><text x="24" y="124" fill="#C4C4C4" font-size="13">Social shell</text><text x="24" y="148" fill="#C4C4C4" font-size="13">Accessible routes</text><text x="24" y="172" fill="#C4C4C4" font-size="13">Socket client</text><text x="24" y="199" fill="#FF8A7F" font-size="10" letter-spacing="1.5">UI / STATE / CONSENT</text></g>
    <g transform="translate(388 190)"><rect width="246" height="220" fill="#050505" stroke="#671515"/><rect width="5" height="220" fill="#E84B4B"/><text x="24" y="38" fill="#FF8A7F" font-size="11" letter-spacing="2">02 / EDGE</text><text x="24" y="84" fill="#F5EAEA" font-size="25">Express 5</text><text x="24" y="124" fill="#C4C4C4" font-size="13">REST contracts</text><text x="24" y="148" fill="#C4C4C4" font-size="13">Socket.IO auth</text><text x="24" y="172" fill="#C4C4C4" font-size="13">Rate limits</text><text x="24" y="199" fill="#FF8A7F" font-size="10" letter-spacing="1.5">API / REALTIME / GATES</text></g>
    <g transform="translate(714 190)"><rect width="246" height="220" fill="#050505" stroke="#671515"/><rect width="5" height="220" fill="#E84B4B"/><text x="24" y="38" fill="#FF8A7F" font-size="11" letter-spacing="2">03 / DATA</text><text x="24" y="84" fill="#F5EAEA" font-size="25">Postgres</text><text x="24" y="124" fill="#C4C4C4" font-size="13">Drizzle schema</text><text x="24" y="148" fill="#C4C4C4" font-size="13">Transactions</text><text x="24" y="172" fill="#C4C4C4" font-size="13">Privacy allowlists</text><text x="24" y="199" fill="#FF8A7F" font-size="10" letter-spacing="1.5">PERSISTENCE / MIGRATIONS</text></g>
    <g transform="translate(1040 190)"><rect width="246" height="220" fill="#050505" stroke="#671515"/><rect width="5" height="220" fill="#E84B4B"/><text x="24" y="38" fill="#FF8A7F" font-size="11" letter-spacing="2">04 / WORKERS</text><text x="24" y="84" fill="#F5EAEA" font-size="25">Redis</text><text x="24" y="124" fill="#C4C4C4" font-size="13">Queues</text><text x="24" y="148" fill="#C4C4C4" font-size="13">Notifications</text><text x="24" y="172" fill="#C4C4C4" font-size="13">Readiness checks</text><text x="24" y="199" fill="#FF8A7F" font-size="10" letter-spacing="1.5">ASYNC / HEALTH / OPS</text></g>
    <g transform="translate(1366 190)"><rect width="172" height="220" fill="#050505" stroke="#E84B4B"/><rect width="5" height="220" fill="#FF8A7F"/><text x="22" y="38" fill="#FF8A7F" font-size="11" letter-spacing="2">05 / PROVIDERS</text><text x="22" y="82" fill="#F5EAEA" font-size="20">Fail closed</text><text x="22" y="122" fill="#C4C4C4" font-size="12">Resend</text><text x="22" y="145" fill="#C4C4C4" font-size="12">Cloudinary</text><text x="22" y="168" fill="#C4C4C4" font-size="12">Moderation</text><text x="22" y="191" fill="#FF8A7F" font-size="10" letter-spacing="1.2">OPTIONAL / GATED</text></g>
    <path d="M316 300H380M642 300H706M968 300H1032M1294 300H1358" stroke="url(#wire)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="1.8s" repeatCount="indefinite"/></path>
  </g>
  <path d="M62 500H1538" stroke="#671515"/><text x="62" y="548" fill="#C4C4C4" font-family="DM Mono, monospace" font-size="12" letter-spacing="1.6">AUTHENTICATION / CONSENT / CONTENT SAFETY / MEDIA / COMMERCE / LIVE ROOMS</text><text x="1538" y="548" text-anchor="end" fill="#E84B4B" font-family="DM Mono, monospace" font-size="12" letter-spacing="1.6">FEATURE FLAGS STAY OFF UNTIL ACCEPTANCE</text>
</svg>
