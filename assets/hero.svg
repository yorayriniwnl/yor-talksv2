<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Yor Talks realtime social communication system</title>
  <desc>YOR Talks is a React and Vite frontend with an Express and Socket.IO API backed by Postgres and Drizzle. Code-ready, deployment blocked pending infrastructure and provider acceptance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000000"/><stop offset=".62" stop-color="#050505"/><stop offset="1" stop-color="#2A0505"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#671515" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A7F"/><stop offset="1" stop-color="#671515" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#F5EAEA" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)" opacity=".65"/>
  <circle cx="1350" cy="110" r="250" fill="#671515" opacity=".16" filter="url(#glow)"/>
  <circle cx="1410" cy="108" r="132" stroke="#E84B4B" stroke-opacity=".38" stroke-width="2" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="0 1410 108" to="360 1410 108" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="1410" cy="108" r="86" stroke="#FF8A7F" stroke-opacity=".42" stroke-width="1" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="360 1410 108" to="0 1410 108" dur="11s" repeatCount="indefinite"/></circle>
  <path d="M72 176H1528" stroke="url(#line)"/>
  <path d="M72 605H1528" stroke="url(#line)"/>
  <g font-family="DM Mono, monospace">
    <text x="86" y="104" fill="#FF8A7F" font-size="15" letter-spacing="4">YOR // SYSTEM 02 / REALTIME COMMUNICATION</text>
    <text x="86" y="300" fill="#F5EAEA" font-family="Cormorant Garamond, Georgia, serif" font-size="118" font-weight="600" letter-spacing="-4">Yor Talks</text>
    <text x="92" y="365" fill="#C4C4C4" font-size="19" letter-spacing="2">A social product surface where identity, conversation, and safety meet.</text>
    <text x="92" y="429" fill="#E84B4B" font-size="14" letter-spacing="3">REACT + VITE  /  EXPRESS + SOCKET.IO  /  POSTGRES + DRIZZLE</text>
    <g transform="translate(92 494)">
      <rect width="242" height="58" fill="#050505" stroke="#671515"/>
      <text x="18" y="24" fill="#FF8A7F" font-size="11" letter-spacing="2">STATUS</text><text x="18" y="44" fill="#F5EAEA" font-size="14" letter-spacing="1">CODE-READY</text>
      <rect x="258" width="302" height="58" fill="#050505" stroke="#671515"/>
      <text x="276" y="24" fill="#FF8A7F" font-size="11" letter-spacing="2">RELEASE GATE</text><text x="276" y="44" fill="#F5EAEA" font-size="14" letter-spacing="1">DEPLOYMENT BLOCKED</text>
    </g>
    <text x="92" y="652" fill="#C4C4C4" font-size="11" letter-spacing="2">FEED / MESSAGES / STORIES / CREATOR TOOLS / PROVIDER FAIL-CLOSED BOUNDARIES</text>
    <text x="1512" y="652" text-anchor="end" fill="#FF8A7F" font-size="11" letter-spacing="2">YOR / 2026</text>
  </g>
  <g transform="translate(1210 350)">
    <rect width="282" height="172" fill="#050505" fill-opacity=".9" stroke="#671515"/>
    <rect width="5" height="172" fill="#E84B4B"/>
    <text x="28" y="34" fill="#FF8A7F" font-family="DM Mono, monospace" font-size="11" letter-spacing="2">OPERATOR SURFACE</text>
    <path d="M28 62H252M28 91H213M28 120H238" stroke="#C4C4C4" stroke-opacity=".22"/>
    <circle cx="244" cy="62" r="4" fill="#E84B4B"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="91" r="4" fill="#FF8A7F"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" begin="-.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="120" r="4" fill="#E84B4B"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" begin="-.3s" repeatCount="indefinite"/></circle>
    <text x="28" y="153" fill="#C4C4C4" font-family="DM Mono, monospace" font-size="10" letter-spacing="1.5">SIGNAL / TRUST / PRESENCE</text>
  </g>
</svg>
